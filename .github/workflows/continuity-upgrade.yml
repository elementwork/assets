name: Continuity Upgrade

on:
  push:
    branches:
      - codex/direct-save-handoff
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: codex/direct-save-handoff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pyflakes playwright

      - name: Apply product migration and hardening
        run: |
          python tools/apply_continuity_upgrade.py
          python tools/harden_continuity_upgrade.py

      - name: Type check
        run: python -m py_compile src/*.py tests/*.py

      - name: Lint (allow repository baseline only)
        run: |
          set +e
          python -m pyflakes src/*.py tests/*.py 2>&1 | tee /tmp/pyflakes.log
          set -e
          python - <<'PY'
          from pathlib import Path
          allowed = (
              "local variable 'icon' is assigned to but never used",
              "local variable 'color' is assigned to but never used",
              "f-string is missing placeholders",
              "SyntaxWarning: invalid escape sequence",
              "return bad.every(v =>",
          )
          bad = [line for line in Path('/tmp/pyflakes.log').read_text(encoding='utf-8').splitlines()
                 if line.strip() and not any(token in line for token in allowed)]
          if bad:
              raise SystemExit('New lint findings:\n' + '\n'.join(bad))
          print('Only pre-existing lint warnings remain')
          PY

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Regenerate all checked-in editions
        run: |
          python src/generate_asset_inventory.py --tier free -o html
          python src/generate_asset_inventory.py --tier free -o html --lang zh
          python src/generate_asset_inventory.py --tier family -o html
          python src/generate_asset_inventory.py --tier family -o html --lang zh
          python src/generate_asset_inventory.py --tier planning
          python src/generate_asset_inventory.py --tier planning --lang zh

      - name: Final full E2E
        run: |
          set -o pipefail
          python tests/e2e_visual_test.py 2>&1 | tee /tmp/e2e.log

      - name: Refresh verified check count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/dev/feature_list.md')
          s = p.read_text(encoding='utf-8')
          count = sum(1 for line in Path('/tmp/e2e.log').read_text(encoding='utf-8').splitlines() if '  PASS  ' in line)
          if '__E2E_CHECKS__' not in s:
              raise SystemExit('feature-list E2E placeholder missing')
          p.write_text(s.replace('__E2E_CHECKS__', str(count), 1), encoding='utf-8')
          print(f'Verified E2E checks: {count}')
          PY

      - name: Remove one-shot migration plumbing
        run: |
          rm -f tools/apply_continuity_upgrade.py tools/harden_continuity_upgrade.py
          rm -f .github/workflows/continuity-upgrade.yml .continuity-trigger
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Review final change set
        run: |
          git status --short
          git diff --stat

      - name: Commit verified product changes
        if: github.event_name == 'push'
        run: |
          git config user.name "elementwork"
          git config user.email "elementworkinc@gmail.com"
          git add -A
          git commit -m "Add direct save and estate continuity workflows"
          git push origin HEAD:codex/direct-save-handoff
